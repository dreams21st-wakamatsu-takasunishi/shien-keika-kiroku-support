name: Dependency security checks

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check runtime and development dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run check
